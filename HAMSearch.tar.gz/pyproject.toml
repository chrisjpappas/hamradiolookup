HAMSearch.toml
name = "callsign-lookup"
version = "1.0.0"
description = "A CLI tool to look up U.S. amateur radio callsigns using the Callook.info API."
authors = [
    { name="Your Name", email="your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["ham radio", "callsign", "lookup", "amateur radio", "FCC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Ham Radio",
    "Environment :: Console"
]

dependencies = [
    "requests >=2.25.0"
]

[project.scripts]
callsign-lookup = "callsign_lookup:main"
